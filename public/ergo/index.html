<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ergo voice</title>
    <style>
      :root { color-scheme: light; font-family: Roboto, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: linear-gradient(160deg, #e7f4f5, #f6fafa 45%, #e8eef6); color: #003970; }
      main { width: min(560px, calc(100% - 32px)); display: grid; gap: 14px; padding: 28px; border-radius: 28px; background: #fff; box-shadow: 0 18px 40px rgba(0, 57, 112, 0.12); }
      h1 { margin: 0; font-size: 1.6rem; }
      p { margin: 0; color: #54595f; line-height: 1.5; }
      textarea { width: 100%; min-height: 140px; box-sizing: border-box; border: 1px solid #d5e4e6; border-radius: 16px; padding: 12px; font: inherit; color: inherit; resize: vertical; }
      button { height: 44px; border: 0; border-radius: 14px; background: #003970; color: #fff; font: inherit; font-weight: 600; }
      button:disabled { opacity: 0.45; }
      #status { min-height: 1.25rem; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ergo voice</h1>
      <p>This voice runs in your browser with WebGPU. The first visit downloads the model. No API key.</p>
      <textarea id="text">Hello from Manage Tech Service.</textarea>
      <button id="speak" type="button">Speak</button>
      <p id="status" role="status"></p>
    </main>
    <script type="module">
      import { engine, localFetch } from "./engine.js";
      const MODELS = "https://huggingface.co/Zyphra/ZONOS3-Mini/resolve/ab25a556ef61a9ce6a4ea8d102e649b4dc06e507/web/";
      const status = document.querySelector("#status");
      const button = document.querySelector("#speak");
      let starting = null;
      button.addEventListener("click", async () => {
        button.disabled = true;
        try {
          starting ??= engine.init((progress) => {
            const pct = progress.total ? Math.round((progress.loaded / progress.total) * 100) : 0;
            status.textContent = `Loading ${progress.models.join(", ")} ${pct}%`;
          }, { base: MODELS });
          await starting;
          status.textContent = "Speaking…";
          const listed = await localFetch("/v2/speakers").then((response) => response.json());
          const voice = listed.speakers?.[0]?.id;
          const response = await localFetch("/v1/audio/speech", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ model: "ergo-v3", input: document.querySelector("#text").value, voice, response_format: "wav" }),
          });
          if (!response.ok) throw new Error(await response.text());
          const url = URL.createObjectURL(await response.blob());
          const audio = new Audio(url);
          audio.onended = () => URL.revokeObjectURL(url);
          await audio.play();
          status.textContent = "Playing.";
        } catch (cause) {
          status.textContent = cause instanceof Error ? cause.message : "Ergo could not read that.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
